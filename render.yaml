# Render Blueprint — Calibers Xis
# One-click deploy ke liye yeh configuration file
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: calibers-xis
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: SUPABASE_URL
        value: https://lzgrtnrhqiifgzyanwpn.supabase.co
      # ⚠️ NOTE: Aapki app.py file mein jo env var name hai woh "sb_secret_Qrka0FG6ZV9KsD0wzEIXqg_KeUUK5ie" hai
      # (os.getenv("sb_secret_Qrka0FG6ZV9KsD0wzEIXqg_KeUUK5ie")).
      # Is liye Render dashboard mein env var ka NAAM yahi set karein,
      # aur VALUE mein actual service role key daalein.
      - key: sb_secret_Qrka0FG6ZV9KsD0wzEIXqg_KeUUK5ie
        sync: false
